# Studio OS — Docker Compose (PostgreSQL + Migrator + Fastify API + Next.js Web)
# Security posture:
#   - PostgreSQL is NEVER published to the host/internet (internal network only).
#   - Web binds strictly to 127.0.0.1:3000 for Cloudflare Tunnel ingress (no public inbound ports).
#   - All runtime containers run as non-root with resource limits and log rotation.

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio_os}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - studio_os_pgdata:/var/lib/postgresql/data
    networks:
      - studio_internal
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-studio_os}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrator:
    build:
      context: .
      target: migrator
    profiles: ["ops"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio_internal

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio_internal
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      API_INTERNAL_ORIGIN: http://api:4000
      PUBLIC_SITE_ORIGIN: ${PUBLIC_SITE_ORIGIN:-https://studio.ibrahimzahir.com}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-https://assets.studio.ibrahimzahir.com}
      PINTEREST_DOMAIN_VERIFY: ${PINTEREST_DOMAIN_VERIFY:-}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?AUTH_DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
    ports:
      - "127.0.0.1:3200:3000"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - studio_internal
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    profiles: ["tunnel"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_started
    networks:
      - studio_internal
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  studio_internal:
    driver: bridge

volumes:
  studio_os_pgdata:
